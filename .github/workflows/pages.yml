name: Deploy the page to GitHub Pages

# web/static/ is a plain static front end: it runs from Pages and asks for the
# URL of a deobf server (web/server.py) the first time it is opened.
on:
  push:
    # whichever of these is the repository's default branch
    branches: [main, "claude/deobfuscator-website-kuv9z3"]
    paths: ["web/static/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # turn Pages on (source: GitHub Actions) the first time this runs
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/static
      - id: deployment
        uses: actions/deploy-pages@v4
